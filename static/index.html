<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moonlight Server Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #e8e8e8;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: #2d3748;
            padding: 30px;
            border-radius: 6px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #6b8e23;
            font-weight: 600;
            font-size: 2.5rem;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-card {
            background: #4a5568;
            padding: 25px;
            border-radius: 4px;
            border-left: 4px solid #6b8e23;
            text-align: center;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .status-card.websocket {
            border-left-color: #68d391;
        }

        .status-card.websocket.offline {
            border-left-color: #fc8181;
            color: #fc8181;
        }

        .client-list {
            margin-top: 20px;
            border-radius: 4px;
            background: #2d3748;
            padding: 25px;
        }

        .client-list h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #6b8e23;
            font-weight: 600;
            font-size: 1.4rem;
        }

        .clients-table {
            width: 100%;
            border-collapse: collapse;
            background: #1a202c;
            border-radius: 4px;
            overflow: hidden;
        }

        .clients-table th {
            background: #6b8e23;
            color: #1a202c;
            padding: 16px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .clients-table td {
            padding: 16px 20px;
            border-bottom: 1px solid #4a5568;
            color: #e8e8e8;
            font-weight: 400;
        }

        .clients-table tr:hover {
            background: #4a5568;
        }

        .clients-table tr:last-child td {
            border-bottom: none;
        }

        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-dot.online {
            background-color: #68d391;
            animation: pulse-green 2s infinite;
        }

        .status-dot.offline {
            background-color: #fc8181;
        }

        @keyframes pulse-green {
            0% {
                box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(40, 167, 69, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(40, 167, 69, 0);
            }
        }

        .protocol-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .protocol-badge.http {
            background: #6b8e23;
            color: #1a202c;
            font-weight: 600;
        }

        .protocol-badge.ws {
            background: #68d391;
            color: #1a202c;
            font-weight: 600;
        }

        .test-section {
            margin-top: 30px;
            background: #2d3748;
            padding: 25px;
            border-radius: 4px;
        }

        .test-section h3 {
            color: #6b8e23;
            font-weight: 600;
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .test-section label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            color: #e8e8e8;
            font-weight: 500;
        }

        .test-section input,
        .test-section textarea,
        .test-section select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #4a5568;
            border-radius: 3px;
            background: #1a202c;
            color: #e8e8e8;
            font-family: 'Inter', sans-serif;
        }

        .test-section input:focus,
        .test-section textarea:focus,
        .test-section select:focus {
            outline: none;
            border-color: #6b8e23;
        }

        .test-section textarea {
            resize: vertical;
            height: 120px;
        }

        .test-section button {
            margin-top: 20px;
            background: #6b8e23;
            color: #1a202c;
            border: none;
            padding: 12px 24px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }

        #task-result {
            margin-top: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            background: #1a202c;
            color: #e8e8e8;
            padding: 16px;
            border-radius: 3px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #4a5568;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        #task-result h4 {
            color: #6b8e23;
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌙 Moonlight Server Dashboard</h1>
        <div class="status-grid">
            <div class="status-card" id="server-status-card">
                Server Status<br /><span id="server-status">Loading...</span>
            </div>
            <div class="status-card websocket" id="ws-status-card">
                WebSocket Status<br /><span id="ws-status">Connecting...</span>
            </div>
            <div class="status-card" id="client-count-card">
                Active Clients<br /><span id="client-count">0</span>
            </div>
            <div class="status-card" id="task-count-card">
                Tasks Processed<br /><span id="task-count">0</span>
            </div>
        </div>

        <div class="client-list">
            <h3>Connected Clients</h3>
            <div id="client-list">
                <p>Loading clients...</p>
            </div>
        </div>

        <div class="test-section">
            <h3>Test Task Request</h3>
            <form id="task-form">
                <label for="region">Region:</label>
                <select id="region">
                    <option value="global">Global (Any Region)</option>
                </select>
                <label for="payload">Payload (JSON):</label>
                <textarea id="payload"
                    placeholder='{"test": "data"}'>{"test": "data", "message": "Hello from dashboard!"}</textarea>
                <button type="submit">Send Task</button>
            </form>
            <div id="task-result"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let taskCount = 0;

        function updateWebSocketStatus(text, online) {
            const wsStatusEl = document.getElementById('ws-status');
            const wsCard = document.getElementById('ws-status-card');
            wsStatusEl.textContent = text;
            if (online) {
                wsCard.classList.remove('offline');
            } else {
                wsCard.classList.add('offline');
            }
        }

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;

            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                updateWebSocketStatus('Connected', true);
                console.log('WebSocket connected');
            };
            ws.onmessage = function (event) {
                const msg = JSON.parse(event.data);
                if (msg.type === 'task') {
                    taskCount++;
                    document.getElementById('task-count').textContent = taskCount;
                }
            };
            ws.onclose = function () {
                updateWebSocketStatus('Disconnected', false);
                console.log('WebSocket disconnected');
                // Reconnect
                setTimeout(initWebSocket, 5000);
            };
            ws.onerror = function (err) {
                updateWebSocketStatus('Error', false);
                console.error('WebSocket error:', err);
            };
        }

        async function fetchRegions() {
            try {
                const response = await fetch('/region');
                const data = await response.json();
                const regionSelect = document.getElementById('region');

                // Clear existing options except the first one
                regionSelect.innerHTML = '<option value="global">Global (Any Region)</option>';

                // Add region options
                data.regions.forEach(region => {
                    if (region !== 'global') {
                        const option = document.createElement('option');
                        option.value = region;
                        option.textContent = region;
                        regionSelect.appendChild(option);
                    }
                });
            } catch (e) {
                console.error('Error fetching regions:', e);
            }
        }

        async function fetchClients() {
            try {
                const response = await fetch('/clients/table', {
                    headers: { 'Accept': 'application/json' }
                });
                const data = await response.json();
                const clientList = document.getElementById('client-list');
                if (!data.length) {
                    clientList.innerHTML = '<p>No clients connected</p>';
                    document.getElementById('client-count').textContent = '0';
                    return;
                }
                document.getElementById('client-count').textContent = data.length;

                let html = `
                    <table class="clients-table">
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Node ID</th>
                                <th>IP Address</th>
                                <th>Protocol</th>
                                <th>Last Seen</th>
                            </tr>
                        </thead>
                        <tbody>`;

                data.forEach(client => {
                    const isOnline = client.connected === 'connected';
                    const statusDotClass = isOnline ? 'online' : 'offline';
                    const protocolClass = client.protocol.toLowerCase();

                    // Format date nicely
                    const date = new Date(client.last_seen);
                    const now = new Date();
                    const diffMs = now - date;
                    const diffMins = Math.floor(diffMs / 60000);
                    const diffHours = Math.floor(diffMs / 3600000);
                    const diffDays = Math.floor(diffMs / 86400000);

                    let lastSeen;
                    if (diffMins < 1) {
                        lastSeen = 'Just now';
                    } else if (diffMins < 60) {
                        lastSeen = `${diffMins}m ago`;
                    } else if (diffHours < 24) {
                        lastSeen = `${diffHours}h ago`;
                    } else if (diffDays < 7) {
                        lastSeen = `${diffDays}d ago`;
                    } else {
                        lastSeen = date.toLocaleDateString('en-US', {
                            month: 'short',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    }

                    html += `
                        <tr>
                            <td>
                                <span class="status-dot ${statusDotClass}"></span>
                                ${isOnline ? 'Online' : 'Offline'}
                            </td>
                            <td><strong>${client.node_id}</strong></td>
                            <td>${client.ip}</td>
                            <td><span class="protocol-badge ${protocolClass}">${client.protocol}</span></td>
                            <td>${lastSeen}</td>
                        </tr>`;
                });

                html += '</tbody></table>';
                clientList.innerHTML = html;
            } catch (e) {
                console.error('Error fetching clients:', e);
                document.getElementById('client-list').innerHTML = '<p>Error loading clients</p>';
            }
        }

        document.getElementById('task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const region = document.getElementById('region').value;
            const payloadText = document.getElementById('payload').value;
            const taskResult = document.getElementById('task-result');
            try {
                const payload = JSON.parse(payloadText);
                const response = await fetch('/task/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ region, payload })
                });
                const text = await response.text();
                taskResult.innerHTML = `<h4>Response (Status: ${response.status}):</h4><pre>${text}</pre>`;
            } catch (error) {
                taskResult.innerHTML = `<h4>Error:</h4><pre>${error.message}</pre>`;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            initWebSocket();
            document.getElementById('server-status').textContent = 'Online';
            fetchRegions();
            fetchClients();
            setInterval(fetchClients, 3000);
            setInterval(fetchRegions, 30000); // Refresh regions every 30 seconds
        });
    </script>
</body>

</html>
