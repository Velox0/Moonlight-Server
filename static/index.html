<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moonlight Server Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container" role="main" aria-label="Moonlight Server Dashboard">
        <h1 class="dashboard-tech-term">
            <span class="sym">[</span> MOONLIGHT <span class="sym">]</span>
            <span class="sub-label">// SERVER DASHBOARD</span>
        </h1>

        <!-- JSON formatted status block -->
        <div class="status-json-wrapper" aria-live="polite" aria-atomic="true" role="region"
            aria-label="Status Information">
            <span class="status-json-brace">{</span>
            <div class="status-json">
                <div class="keys">
                    <div>"server":</div>
                    <div id="ws-status-card">"websocket":</div>
                    <div>"clients":</div>
                    <div>"tasks":</div>
                </div>
                <div class="values">
                    <span id="server-status" class="status-online">Loading...</span>
                    <span id="ws-status" class="status-connected">Connecting...</span>
                    <span id="client-count" class="status-num">0</span>
                    <span id="task-count" class="status-num">0</span>
                </div>
            </div>
            <span class="status-json-brace">}</span>
        </div>

        <div class="content-grid">
            <section class="client-list" aria-label="Connected Clients">
                <h3>Connected Clients</h3>
                <div id="client-list">
                    <p>Loading clients...</p>
                </div>
            </section>
            <section class="test-section" aria-label="Send Test Task">
                <h3>Send Test Task</h3>
                <form id="task-form">
                    <label for="region">Region:</label>
                    <select id="region" aria-required="true">
                        <option value="global">Global (Any Region)</option>
                    </select>
                    <label for="payload">Payload (JSON):</label>
                    <textarea id="payload" aria-required="true"
                        placeholder='{"test": "data"}'>{"test": "data", "message": "Hello from dashboard!"}</textarea>
                    <button type="submit" class="submit-button">Send Task</button>
                </form>
                <div id="task-result" role="region" aria-live="polite" aria-atomic="true"></div>
            </section>
        </div>
        <script src="/static/script.js"></script>
    </div>

    <!-- Theme Toggle Button - Right Edge Tab -->
    <div class="theme-toggle-tab">
        <button id="theme-toggle" class="theme-toggle-tab-btn" aria-label="Toggle theme">
            <span class="theme-icon">🌙</span>
        </button>
    </div>
</body>

</html>
